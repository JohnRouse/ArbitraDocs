name: Build ArbitraDocs Windows Beta

on:
  push:
    branches:
      - "dev/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name ArbitraDocs `
            --paths src `
            --collect-all pymupdf `
            src/arbitrapdf/gui.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ArbitraDocs.exe")) { throw "No se generó ArbitraDocs.exe" }
          Get-Item "dist/ArbitraDocs.exe" | Format-List Name,Length,FullName

      - name: Upload Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: ArbitraDocs-Windows-Beta
          path: dist/ArbitraDocs.exe
          if-no-files-found: error
          retention-days: 14
