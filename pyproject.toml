[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrapdf"
version = "0.1.0.dev0"
description = "Herramientas locales para expedientes y documentos PDF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arbitrapdf = "arbitrapdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
